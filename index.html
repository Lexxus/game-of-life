<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Game of LIFE</title>
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="version" content="2.2.0" />
</head>

<body class="theme-default">
  <canvas id="life" class="movable"></canvas>

  <div id="controlPanel" class="control-panel opened">
    <div class="controls">
      <button id="btnCtrlClose" class="btn mini m-right-05 icon icon-primary icon-arrow-bar-right" title="Hide control panel"></button>
      <button class="btn icon icon-play icon-primary action-start" title="Start/Stop" style="min-width: 71px">Start</button>
      <button class="btn icon icon-next icon-primary action-step" title="Step to next iteration">Step</button>
      <button class="btn icon icon-danger icon-trash action-clear" title="Clear - remove all the cells">Clear</button>
      <button id="btnRnd" class="btn" title="Put cells randomly">Rnd</button>
    </div>
    <div class="control-speed">
      <label>Speed: </label><input type="range" id="speed" min="1" max="50" value="5" />
      <span class="speed-value" id="speedValue">50</span>
    </div>
    <div class="info">
      <div title="Current iteration"><label>Life cycle:</label><span id="life-cycle"></span></div>
      <div title="Cells on the board: live / total"><label>Cells:</label><span id="cells"></span></div>
      <div title="Maximum number of live cells"><label>Max cells:</label><span id="max-cells"></span></div>
      <div title="minimum / current / maximum (how many iterations it would calculate in full gas)"><label>FPS:</label><span id="time"></span></div>
      <div title="Current coordinates of center of the grid"><label>X:Y</label><span id="coords"></span></div>
    </div>
    <div class="zoom">
      <label>Zoom:</label>
      <span>
        <button id="btnZoomOut" class="btn zoom-btn" style="border-radius: 6px 0 0 6px;">-</button>
        <span id="zoomValue" class="zoom-value">6</span>
        <button id="btnZoomIn" class="btn zoom-btn" style="border-radius: 0 6px 6px 0;">+</button>
      </span>
      <button id="btnHome" class="btn icon icon-cross-hair" title="Move to the initial position. Keep SHIFT to move to the first alive cell. CTRL+SHIFT - move to the last alive cell." />
    </div>
    <div class="other-controls">
      <label>
        <input id="checkboxStopOn" name="StopStable" type="checkbox" checked="true" />
        stop if stable
      </label>
      <button id="btnSave" class="btn" title="Copy current structure into clipboard and browser's console in RLE format">Copy pattern</button>
    </div>
  </div>
  <div id="controlPanelMini" class="control-panel-mini hidden">
    <button id="btnCtrlOpen" class="btn mini icon icon-primary icon-arrow-bar-left m-bottom-05" title="Open control panel"></button>
    <button class="btn icon icon-primary icon-play action-start" title="Start/Stop"></button>
    <button class="btn icon icon-primary icon-next action-step" title="Step to next iteration"></button>
    <button class="btn icon icon-danger icon-trash action-clear" title="Clear the field"></button>
    <input name="StopStable" type="checkbox" checked="true" title="Stop iterations is structure is stable, i.e. oscillator, spaceship etc." />
  </div>
  <button id="btnPatterns" class="btn" title="Open the panel with patterns library">Patterns</button>
  <div id="patternsPanel" class="patterns-panel drawer drawer-left">
    <div class="drawer-header">
      <h2 class="title">PATTERNS</h2>
      <button id="btnClose" class="btn icon icon-primary icon-arrow-bar-left mini"></button>
    </div>
    <div class="patterns-panel-body">
      <form id="patternForm">
        <div id="patternCategories" class="btn-group">
          <label class="btn-radio icon-right icon-search" title="Search">
            <input type="radio" name="category" value="" checked />
          </label>
        </div>
        <div id="patternSearch" class="search">
          <input type="text" id="search" class="input-text" placeholder="Search..." />
        </div>
      </form>
      <div id="categoryDescription" class="patterns-category-description"></div>
      <div id="pageNav" class="patterns-page-nav">
        <button id="btnPageNavPrev" class="btn icon icon-chevron-left" title="Prev">Prev</button>
        <span id="pageNums"></span>
        <button id="btnPageNavNext" class="btn icon-right icon-chevron-right" title="Next">Next</button>
      </div>
      <ul id="patterns" class="collection"></ul>
    </div>
  </div>
  <footer class="footer">
    <div class="help">Ctrl+LMouse to draw cells</div>
    <div class="about"><strong>Conway's Game of Life</strong> v2.2.0 <small>(by Oleksii Teterin, 2026)</small></div>
  </footer>
  <script type="module" src="js/index.js"></script>
</body>

</html>
